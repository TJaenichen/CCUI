name: Release

# Tag a commit on main as vX.Y.Z and push the tag: the suite runs, the app is published self-contained for x64,
# packed with Velopack (installer, portable zip, full and delta update packages) and uploaded as a GitHub
# release. Installed copies pick the release up on their next update check.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version from the tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        working-directory: src
        run: dotnet test --solution CCUI.sln -c Release

      - name: Publish
        working-directory: src
        run: >
          dotnet publish CCUI.App/CCUI.App.csproj -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.version.outputs.version }} -o ../artifacts/publish

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      # The previous release is the base for delta packages. There is none before the first release.
      - name: Download the previous release
        continue-on-error: true
        run: >
          vpk download github --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} --outputDir artifacts/releases

      - name: Pack
        run: >
          vpk pack --packId CCUI.App --packTitle CCUI --packAuthors "Thorsten Jaenichen"
          --packVersion ${{ steps.version.outputs.version }} --packDir artifacts/publish --mainExe CCUI.exe
          --icon src/CCUI.App/Assets/ccui.ico --runtime win-x64 --shortcuts StartMenuRoot --outputDir artifacts/releases

      - name: Upload to GitHub Releases
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} --publish --releaseName "CCUI ${{ steps.version.outputs.version }}"
          --tag ${{ github.ref_name }} --outputDir artifacts/releases
